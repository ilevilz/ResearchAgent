[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "0.1.0"
description = "ResearchAgent：基于 ReAct + RAG + MCP 的科研智能分析 Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40,<2",
    "httpx>=0.27",
    "pypdf>=4.2",
    "numpy>=1.26",
    "pandas>=2.0",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
embedding = ["sentence-transformers>=2.7"]
faiss = ["faiss-cpu>=1.8"]

[project.scripts]
research-agent = "research_agent.cli:main"

[tool.setuptools.packages.find]
include = ["research_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
