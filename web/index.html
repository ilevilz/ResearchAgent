<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResearchAgent · 科研智能分析 Agent</title>
<style>
  :root {
    --bg: #0b1020;
    --bg-soft: #121a33;
    --panel: #161f3d;
    --border: #26325a;
    --text: #e8ecf8;
    --muted: #8b97bd;
    --accent: #5b8cff;
    --accent-soft: #1d2a52;
    --ok: #35d07f;
    --err: #ff6b6b;
    --warn: #ffc857;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #17224a 0%, var(--bg) 55%);
    color: var(--text); font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: rgba(11,16,32,.7); backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 19px; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .pill {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--accent-soft); color: #b9c8f5;
  }
  #status { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.err { background: var(--err); }

  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 90px; }
  .grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: linear-gradient(180deg, var(--panel), var(--bg-soft));
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px;
  }
  .card h3 { margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }

  #log { display: flex; flex-direction: column; gap: 14px; min-height: 220px; }
  .msg { border-radius: var(--radius); padding: 13px 15px; border: 1px solid var(--border); background: var(--panel); }
  .msg.user { background: var(--accent-soft); border-color: #33477f; }
  .msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 7px; letter-spacing: .4px; }
  .msg .body { white-space: pre-wrap; line-height: 1.65; font-size: 14px; }
  .msg .body code { background: #0d1striped; }
  .meta { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--border); font-size: 11.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }

  .step { border-left: 3px solid var(--accent); background: #101830; border-radius: 8px; padding: 10px 12px; margin: 8px 0; font-size: 13px; }
  .step.bad { border-left-color: var(--err); }
  .step .hd { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .step .act { font-family: ui-monospace, Consolas, monospace; color: #9fd0ff; font-size: 12.5px; }
  .step .lbl { color: var(--muted); font-size: 11px; }
  .step pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; color: #c7d2ee; font-size: 12px; line-height: 1.55; font-family: ui-monospace, Consolas, monospace; }
  details.trace > summary { cursor: pointer; color: var(--muted); font-size: 12px; }

  .composer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(11,16,32,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--border); padding: 13px 20px; }
  .composer-inner { max-width: 1080px; margin: 0 auto; display: flex; gap: 10px; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px; font-size: 14px; font-family: inherit; min-height: 46px; max-height: 140px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 0 20px;
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); font-weight: 500; padding: 0 14px; }

  .chip { display: block; width: 100%; text-align: left; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 11px; font-size: 12.5px; margin-bottom: 7px; cursor: pointer; font-weight: 400; }
  .chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .tool-item { font-size: 12px; color: var(--muted); padding: 5px 0; border-bottom: 1px dashed #1c2544; }
  .tool-item b { color: #a9bcf0; font-weight: 600; }
  .stat { display: flex; justify-content: space-between; font-size: 12.5px; padding: 4px 0; color: var(--muted); }
  .stat b { color: var(--text); font-weight: 600; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #2c3a68; border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>ResearchAgent</h1>
  <span class="sub">ReAct + RAG + MCP 科研智能分析 Agent</span>
  <span class="pill">DeepSeek</span>
  <span class="pill" id="kb-pill">知识库加载中…</span>
  <div id="status"><span class="dot" id="dot"></span><span class="sub" id="status-text">连接中…</span></div>
</header>

<main>
  <div class="grid">
    <div>
      <div class="card">
        <h3>对话</h3>
        <div id="log">
          <div class="msg"><div class="who">ResearchAgent</div><div class="body">你好，我是 ResearchAgent。
我能做：论文检索、PDF 解析、知识库问答（RAG）、实验指标抽取与对比、数据分析。
不依赖提示词的话，直接问我一个科研问题就行 —— 我会展示完整的 ReAct 推理轨迹。</div></div>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:16px">
        <h3>试试这些</h3>
        <button class="chip" data-q="帮我找 3 篇关于 retrieval augmented generation 的论文">🔍 检索 RAG 论文</button>
        <button class="chip" data-q="检索 ReAct agent 相关论文，写入知识库，然后总结这个方向的核心方法">🧠 多步：检索→入库→总结</button>
        <button class="chip" data-q="从这段实验描述中抽取指标：BERT-base 在 SQuAD 上 F1 93.2%，RoBERTa-large 在 SQuAD 上 F1 94.6%，DeBERTa 在 SQuAD 上 F1 95.1%。哪个最好？">📊 抽取并对比实验指标</button>
        <button class="chip" data-q="对这组数值做统计：23.1, 24.5, 22.8, 25.0, 23.9, 24.2">📈 数据统计分析</button>
      </div>

      <div class="card" style="margin-bottom:16px">
        <h3>运行时状态</h3>
        <div class="stat"><span>LLM</span><b id="s-llm">-</b></div>
        <div class="stat"><span>向量后端</span><b id="s-vec">-</b></div>
        <div class="stat"><span>Embedding</span><b id="s-emb">-</b></div>
        <div class="stat"><span>知识库块数</span><b id="s-chunks">-</b></div>
        <div class="stat"><span>工具数</span><b id="s-tools">-</b></div>
      </div>

      <div class="card">
        <h3>可用工具</h3>
        <div id="tools"></div>
      </div>
    </div>
  </div>
</main>

<div class="composer">
  <div class="composer-inner">
    <textarea id="input" placeholder="输入科研问题，Enter 发送 / Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
    <button id="clear" class="ghost">清空</button>
  </div>
</div>

<script>
const logEl = document.getElementById('log');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
let sessionId = localStorage.getItem('ra_session') || ('web-' + Math.random().toString(36).slice(2, 10));
localStorage.setItem('ra_session', sessionId);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addMsg(who, body, meta) {
  const d = document.createElement('div');
  d.className = 'msg' + (who === '你' ? ' user' : '');
  d.innerHTML = `<div class="who">${esc(who)}</div><div class="body">${esc(body)}</div>`
    + (meta ? `<div class="meta">${meta}</div>` : '');
  logEl.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return d;
}

function renderTrace(steps) {
  if (!steps || !steps.length) return '';
  return steps.map(s => `
    <div class="step ${s.ok ? '' : 'bad'}">
      <div class="hd">
        <span class="lbl">STEP ${s.index}</span>
        <span class="act">${esc(s.action || '(final)')}</span>
        <span class="lbl">${s.latency_ms ? Math.round(s.latency_ms) + 'ms' : ''}</span>
      </div>
      ${s.thought ? `<div class="lbl">💭 Thought</div><pre>${esc(s.thought)}</pre>` : ''}
      ${s.action ? `<div class="lbl">📥 Input</div><pre>${esc(JSON.stringify(s.action_input))}</pre>` : ''}
      <div class="lbl">📤 Observation</div><pre>${esc((s.observation || '').slice(0, 900))}</pre>
    </div>`).join('');
}

async function send() {
  const q = inputEl.value.trim();
  if (!q) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMsg('你', q);
  const pending = addMsg('ResearchAgent', '');
  pending.querySelector('.body').innerHTML = '<span class="spinner"></span> 正在推理…';

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query: q, session_id: sessionId, include_trace: true })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()).slice(0, 200));
    const data = await res.json();

    pending.querySelector('.body').innerHTML =
      `<div style="margin-bottom:12px">${esc(data.answer)}</div>
       ${data.trace && data.trace.length
          ? `<details class="trace"><summary>▸ 展开 ReAct 推理轨迹（${data.trace.length} 步）</summary>${renderTrace(data.trace)}</details>`
          : ''}`;
    pending.querySelector('.meta') || pending.insertAdjacentHTML('beforeend', '<div class="meta"></div>');
    pending.querySelector('.meta').innerHTML =
      `<span>${data.success ? '✅ 成功' : '❌ 失败'}</span>
       <span>步数 ${data.steps}</span>
       <span>工具 ${esc((data.tools_used || []).join(', ') || '无')}</span>
       <span>${Math.round(data.latency_ms)} ms</span>
       <span>${data.total_tokens || 0} tokens</span>`;
    pending.scrollIntoView({ behavior: 'smooth', block: 'end' });
  } catch (e) {
    pending.querySelector('.body').innerHTML = `<span style="color:var(--err)">请求失败：${esc(e.message)}</span>`;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.onclick = send;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById('clear').onclick = async () => {
  await fetch('/sessions/' + encodeURIComponent(sessionId), { method: 'DELETE' }).catch(() => {});
  logEl.innerHTML = '';
  addMsg('ResearchAgent', '会话记忆已清空，可以开始新的对话。');
};

document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  inputEl.value = b.dataset.q;
  send();
});

async function boot() {
  try {
    const h = await (await fetch('/health')).json();
    const dot = document.getElementById('dot');
    dot.className = 'dot ' + (h.status === 'ok' ? 'ok' : 'err');
    document.getElementById('status-text').textContent =
      h.status === 'ok' ? '就绪' : (h.llm_configured ? '降级' : '未配置 API Key');

    const llm = h.llm || {};
    document.getElementById('s-llm').textContent = llm.model || '-';
    const kb = h.knowledge_base || {};
    document.getElementById('s-vec').textContent = kb.vector_backend || '-';
    document.getElementById('s-emb').textContent = (kb.embedder || '-').split(':').pop();
    document.getElementById('s-chunks').textContent = kb.num_chunks ?? 0;
    document.getElementById('kb-pill').textContent = `知识库 ${kb.num_chunks ?? 0} 块`;

    const t = await (await fetch('/tools')).json();
    document.getElementById('s-tools').textContent = t.count;
    document.getElementById('tools').innerHTML = t.tools.map(x =>
      `<div class="tool-item"><b>${esc(x.name)}</b><br>${esc((x.description || '').slice(0, 80))}…</div>`).join('');
  } catch (e) {
    document.getElementById('status-text').textContent = '无法连接 API';
  }
}
boot();
</script>
</body>
</html>
